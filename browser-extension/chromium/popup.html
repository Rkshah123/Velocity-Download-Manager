<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velocity</title>
<style>
  :root {
    --card: #141823; --alt: #1A1F2B; --border: #232A37; --text: #F2F5FA;
    --secondary: #AFBACB; --muted: #7A8698; --accent: #5B8CFF; --accent2: #7C6BFF;
    --success: #34D399; --danger: #F87171; --page: #0B0E13;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-width: 372px; background: var(--page); color: var(--text); padding: 12px;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-size: 13px; line-height: 1.45;
  }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px 15px; }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .brand {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 15px;
  }
  .titles { flex: 1; min-width: 0; }
  .title { font-size: 13.5px; font-weight: 600; }
  .subtitle { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name { font-size: 13.5px; font-weight: 600; word-break: break-all; margin-bottom: 7px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 11px; }
  .chip {
    font-size: 10.5px; font-weight: 600; letter-spacing: .4px; padding: 2px 7px; border-radius: 6px;
    background: var(--alt); border: 1px solid var(--border); color: var(--secondary);
  }
  .chip.size { letter-spacing: 0; font-weight: 500; }
  .meta { display: grid; grid-template-columns: 58px 1fr; gap: 8px; font-size: 11.5px; margin-bottom: 5px; }
  .meta .label { color: var(--muted); }
  .meta .value { color: var(--secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta .value.path { font-family: "Cascadia Mono", "Consolas", monospace; font-size: 11px; }
  .error {
    margin: 4px 0 10px; padding: 9px 10px; border-radius: 8px; font-size: 11.5px; line-height: 1.5;
    color: var(--danger); background: rgba(248, 113, 113, .12); border: 1px solid rgba(248, 113, 113, .3);
  }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn {
    flex: 1; padding: 9px 10px; border-radius: 9px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    border: 1px solid transparent; font-family: inherit; text-align: center;
  }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.secondary { color: var(--text); background: var(--alt); border-color: var(--border); }
  .btn.secondary:hover { border-color: var(--accent); }
  .btn.ghost { flex: 0 0 auto; padding: 9px 12px; color: var(--muted); background: transparent; }
  .btn.ghost:hover { color: var(--text); background: var(--alt); }
  .btn[disabled] { opacity: .55; cursor: default; filter: none; }
  .status { margin-top: 9px; font-size: 11px; min-height: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .status.ok { color: var(--success); }
  .status.bad { color: var(--danger); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .footer { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="brand">V</div>
      <div class="titles">
        <div class="title" id="title">Velocity</div>
        <div class="subtitle" id="subtitle">Checking the link…</div>
      </div>
    </div>
    <div id="body"></div>
    <div class="actions" id="actions"></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="footer" id="footer"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
